name: pages-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-prep
    paths:
      - "site/**"
      - "install"
      - "packages/coderrupee/script/schema.ts"
      - ".github/workflows/pages-deploy.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build site
        run: |
          mkdir -p site/out
          cp install site/out/install
          cp site/index.html site/out/index.html
          cp site/zen.html site/out/zen.html
          cp site/go.html site/out/go.html
          cp site/emblem.svg site/out/emblem.svg
          bun site/generate-changelog.ts site/out/changelog.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Generate JSON schemas
        run: bun ./script/schema.ts "$GITHUB_WORKSPACE/site/out/config.json" "$GITHUB_WORKSPACE/site/out/tui.json"
        working-directory: packages/coderrupee

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/out --project-name=coderrupee --branch=main
