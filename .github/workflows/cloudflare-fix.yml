name: cloudflare-fix

# Points coderrupee.opraiz.com at the coderrupee Pages project (currently the
# DNS record targets a dead origin, so Cloudflare returns 522) and verifies
# the site serves.

on:
  workflow_dispatch:

concurrency: cloudflare-fix

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Diagnose Pages project
        run: |
          API="https://api.cloudflare.com/client/v4"
          ACC="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          echo "== project =="
          curl -s "$API/accounts/$ACC/pages/projects/coderrupee" -H "$AUTH" | head -c 1200
          echo
          echo "== deployments (latest 5) =="
          curl -s "$API/accounts/$ACC/pages/projects/coderrupee/deployments" -H "$AUTH" | jq -r '.result[] | "\(.created_on) \(.latest_stage) \(.deployment_trigger.metadata.commit_hash // "n/a")"' | head -5

      - name: Attach custom domain to Pages project
        run: |
          API="https://api.cloudflare.com/client/v4"
          ACC="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          RESULT=$(curl -s -X POST "$API/accounts/$ACC/pages/projects/coderrupee/domains" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"name":"coderrupee.opraiz.com"}')
          echo "$RESULT" | head -c 500
          echo "$RESULT" | grep -q '"success":true' || echo "$RESULT" | grep -q 'already' || echo "::warning::domain attach response unexpected"

      - name: Fix DNS record (CNAME coderrupee -> coderrupee.pages.dev, proxied)
        run: |
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ZONE=$(curl -sf "$API/zones?name=opraiz.com" -H "$AUTH" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then echo "::error::zone opraiz.com not found (token may lack Zone:Read)"; exit 1; fi
          REC_ID=$(curl -sf "$API/zones/$ZONE/dns_records?name=coderrupee.opraiz.com" -H "$AUTH" | jq -r '.result[0].id // empty')
          if [ -n "$REC_ID" ]; then
            echo "deleting stale record $REC_ID"
            curl -sf -X DELETE "$API/zones/$ZONE/dns_records/$REC_ID" -H "$AUTH" || true
          fi
          RESULT=$(curl -s -X POST "$API/zones/$ZONE/dns_records" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"coderrupee","content":"coderrupee.pages.dev","proxied":true}')
          echo "$RESULT" | head -c 500
          echo "$RESULT" | grep -q '"success":true' || { echo "::error::DNS create failed"; exit 1; }

      - name: Verify site serves
        run: |
          sleep 30
          echo "== coderrupee.opraiz.com root (browser UA) =="
          curl -s -D - -o /dev/null --max-time 15 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" "https://coderrupee.opraiz.com/" | grep -iE "HTTP/|server:|cf-mitigated|cf-ray|location" || true
          echo "== changelog.json (curl UA) =="
          curl -s -D - -o /dev/null --max-time 15 "https://coderrupee.opraiz.com/changelog.json" | grep -iE "HTTP/|server:|cf-mitigated|cf-ray" || true
          echo "== pages.dev root =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 15 "https://coderrupee.pages.dev/"
          echo "== pages.dev changelog =="
          curl -s -D - -o /dev/null --max-time 15 "https://coderrupee.pages.dev/changelog.json" | grep -iE "HTTP/|server:" || true
