name: release-unsigned-mac
run-name: "unsigned mac build ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package and attach to the GitHub release (e.g. 1.18.28)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-mac:
    if: github.repository == 'nareinnprs-create/coderrupee'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            arch: --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            arch: --arm64
            bun_install_flags: --os=darwin --cpu=arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: dev

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          CODERRUPEE_VERSION: ${{ inputs.version }}
          CODERRUPEE_CHANNEL: prod

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CODERRUPEE_VERSION: ${{ inputs.version }}
          CODERRUPEE_CHANNEL: prod

      - name: Package (unsigned)
        run: npx electron-builder --mac ${{ matrix.settings.arch }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          CODERRUPEE_CHANNEL: prod
          CODERRUPEE_UNSIGNED: "1"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coderrupee-desktop-${{ matrix.settings.target }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip

      - name: Upload to GitHub release
        run: gh release upload "v${{ inputs.version }}" packages/desktop/dist/*.dmg packages/desktop/dist/*.zip --clobber --repo nareinnprs-create/coderrupee
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}