<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CoderRupee — build without boundaries</title>
    <meta name="description" content="CoderRupee is an AI coding agent for the terminal and desktop." />
    <style>
      :root {
        --carbon-forest: #141713;
        --signal-lime: #d7ff64;
        --studio-ivory: #f5f5ee;
        --execution-mint: #7dd6c1;
        --raised: #252a22;
        --border: #3a4035;
        --secondary: #adb3a5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--carbon-forest);
        color: var(--studio-ivory);
        font-family: Inter, system-ui, sans-serif;
      }
      main { max-width: 640px; padding: 48px 24px; }
      .wordmark { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
      .emblem { width: 44px; height: 44px; }
      h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
      p.tagline { color: var(--signal-lime); text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; margin: 0 0 28px; }
      p.lede { color: var(--secondary); line-height: 1.6; margin-top: 0; }
      code {
        display: block;
        background: var(--raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 20px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 14px;
        color: var(--execution-mint);
        overflow-x: auto;
        white-space: pre;
      }
      nav { display: flex; gap: 20px; margin-top: 28px; flex-wrap: wrap; }
      a { color: var(--studio-ivory); text-decoration: none; border-bottom: 1px solid var(--border); }
      a:hover { color: var(--signal-lime); }
      @media (prefers-reduced-motion: no-preference) {
        a { transition: color 0.15s ease; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">
        <img class="emblem" src="/emblem.svg" alt="CoderRupee emblem" />
        <h1>CoderRupee</h1>
      </div>
      <p class="tagline">Build without boundaries</p>
      <p class="lede">CoderRupee is an AI coding agent that lives in your terminal and desktop. Install it with one command:</p>
      <code>curl -fsSL https://coderrupee.opraiz.com/install | bash</code>
      <nav>
        <a href="https://github.com/nareinnprs-create/coderrupee/releases">Releases</a>
        <a href="/changelog.json">Changelog</a>
        <a href="/config.json">Config schema</a>
        <a href="/tui.json">TUI schema</a>
      </nav>
    </main>
  </body>
</html>
